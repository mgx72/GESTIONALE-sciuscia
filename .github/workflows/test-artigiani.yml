name: Test rientri artigiani

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test calendario italiano in un fuso diverso
        run: node --test tests/artigiani-calendar.test.cjs
        env:
          TZ: America/Los_Angeles
      - name: Autotest con database SQLite reale
        run: dotnet run --project src/Sciuscia.Foundations/Sciuscia.Foundations.csproj --configuration Release -- --self-test
      - name: Compila anche il bridge e l'interfaccia
        run: dotnet build src/Sciuscia.Ui/Sciuscia.Ui.csproj --configuration Release
